    explanation: "因为矩阵乘法是所有 GPU 优化技术的练兵场：你要依次用到分块（ch02）、共享内存与 bank conflict 消除、向量化加载（float4）、double buffering 流水线、寄存器压力与占用率权衡（ch02/04）。这些思想——把“每个元素单独取料”改成“一批元素共用一箱料”、用合并访存和复用隐藏延迟——在光线追踪、SpMV、stencil 等别的项目里会反复出现。做完 SGEMM，你就有了一套可迁移的优化语言。"
  },
  {
    id: "ch08-q11", chapter: "ch08", type: "fill", difficulty: "⭐⭐",
    question: "实时图像处理管线（项目 6）考察多流并发与 CUDA Graph，其目标是降低____（因为此时启动开销与拷贝/计算重叠比单点算力更重要）。",
    accepts: ["端到端延迟", "end-to-end latency", "延迟"],
    explanation: "项目 6 关心端到端延迟：用多流把传输与计算重叠、用 CUDA Graph 压缩启动开销，整体时延比单 kernel 峰值算力更关键。"
  },
  {
    id: "ch08-q12", chapter: "ch08", type: "judge", difficulty: "⭐⭐",
    question: "结业自检里，“代码能跑出正确结果”就已经达到结业标准，不需要性能报告和 profile 证据。",
    options: ["正确", "错误"],
    answer: 1,
    explanation: "错。第 8 章的结业标准明确要求：可运行代码 + 有说服力的性能报告（环境信息、正确性验证、逐步收益拆解、ncu/nsys 数据）。只有“能跑”不构成交付，报告比代码本身更重要。"

/* ============================ 渲染与交互 ============================ */
const TYPE_LABEL = { single:"单选题", multi:"多选题", judge:"判断题", fill:"代码填空", short:"简答题" };
const state = {};

/* 规范化答案：去掉所有空白、转小写，并把常见分隔符统一成 "|"。
   这样"多个空"无论用  |  ,  ;  、  /  哪个分隔，都能对上同一个标准形式。 */
function normalize(s){
  return (s||"").replace(/\s+/g,"").toLowerCase().replace(/[,;，；、\/]/g,"|");
}

function buildFilters(){
  const chSel = document.getElementById("chapter");
  const seen = new Set();
  QUIZ_DATA.forEach(q=>{
    if(!seen.has(q.chapter)){
      seen.add(q.chapter);
      const o = document.createElement("option");
      o.value = q.chapter; o.textContent = CHAPTERS[q.chapter] || q.chapter;
      chSel.appendChild(o);
    }
  });
}

function matches(q){
  const c = document.getElementById("chapter").value;
  const t = document.getElementById("type").value;
  return (c==="all"||q.chapter===c) && (t==="all"||q.type===t);
}

function render(){
  const root = document.getElementById("quiz");
  root.innerHTML = "";
  const list = QUIZ_DATA.filter(matches);
  if(!list.length){ root.innerHTML = '<div class="empty">该筛选条件下暂无题目（可在文件顶部 QUIZ_DATA 中补充）。</div>'; updateStats(); return; }
  list.forEach(q=> root.appendChild(renderCard(q)));
  updateStats();
}

function renderCard(q){
  const card = document.createElement("div");
  card.className = "card";
  const st = state[q.id] || (state[q.id] = {answered:false, correct:false});

  let meta = `<div class="meta"><span class="tag">${CHAPTERS[q.chapter]||q.chapter}</span>`+
             `<span class="tag">${TYPE_LABEL[q.type]}</span>`+
             `<span class="tag">难度 ${q.difficulty||"—"}</span></div>`;
  let body = `<div class="q">${q.question}</div>`;

  if(q.type==="single" || q.type==="judge" || q.type==="multi"){
    if(q.type==="multi"){
      body += `<div style="font-size:13px;color:var(--muted);margin:-6px 0 10px;">（多选题：可选中多个选项，选好后点“提交”）</div>`;
    }
    body += `<div class="options" id="opt-${q.id}">`+
      q.options.map((o,i)=>`<div class="opt" data-i="${i}"><span class="mark">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`).join("")+
      `</div>`;
  } else if(q.type==="fill"){
    body += `<div class="fillrow"><input id="fill-${q.id}" placeholder="填写答案（忽略空格；多个空可用 | 或 , 分隔）"/><button class="btn" data-check="${q.id}">检查</button></div>`+
            `<div class="feedback hidden" id="fb-${q.id}"></div>`;
  } else if(q.type==="short"){
    body += `<details class="short"><summary>显示参考答案</summary><div class="explain"><div class="h">参考答案</div>${q.explanation}</div></details>`;
  }
  if(q.type!=="short"){
    body += `<div class="explain hidden" id="ex-${q.id}"><div class="h">解析</div>${q.explanation}</div>`;
  }

  card.innerHTML = meta + body;

  if(q.type==="single" || q.type==="judge"){
    card.querySelectorAll(".opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(st.answered) return;
        const i = +el.dataset.i;
        st.answered = true; st.correct = (i===q.answer);
        card.querySelectorAll(".opt").forEach(o=>{
          const oi = +o.dataset.i;
          if(oi===q.answer) o.classList.add("correct");
          else if(oi===i) o.classList.add("wrong");
          else o.classList.add("dim");
        });
        showExplain(q.id); updateStats();
      });
    });
  } else if(q.type==="multi"){
    card.querySelectorAll(".opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(st.answered) return;
        el.classList.toggle("picked");
      });
    });
    const submit = document.createElement("button");
    submit.className = "btn"; submit.textContent = "提交";
    submit.style.marginTop = "12px";
    submit.addEventListener("click", ()=>{
      if(st.answered) return;
      const picked = [...card.querySelectorAll(".opt.picked")].map(e=>+e.dataset.i).sort();
      const ans = [...q.answer].sort();
      const ok = picked.length===ans.length && picked.every((v,k)=>v===ans[k]);
      st.answered = true; st.correct = ok;
      card.querySelectorAll(".opt").forEach(o=>{
        const oi = +o.dataset.i;
        if(q.answer.includes(oi)) o.classList.add("correct");
        else if(o.classList.contains("picked")) o.classList.add("wrong");
        else o.classList.add("dim");
      });
      submit.remove();
      showExplain(q.id); updateStats();
    });
    card.querySelector(".options").after(submit);
  } else if(q.type==="fill"){
    card.querySelector(`[data-check="${q.id}"]`).addEventListener("click", ()=>{
      if(st.answered) return;
      const val = normalize(document.getElementById(`fill-${q.id}`).value);
      const ok = q.accepts.some(a=> a.split("###").map(normalize).includes(val));
      st.answered = true; st.correct = ok;
      const fb = document.getElementById(`fb-${q.id}`);
      fb.classList.remove("hidden");
      fb.className = "feedback " + (ok?"ok":"bad");
      fb.innerHTML = ok ? "✅ 正确！" : "❌ 不正确。参考答案：<code>"+q.accepts[0].split("###")[0]+"</code>";
      document.getElementById(`fill-${q.id}`).disabled = true;
      showExplain(q.id); updateStats();
    });
  }
  return card;
}

function showExplain(id){
  const ex = document.getElementById("ex-"+id);
  if(ex) ex.classList.remove("hidden");
}

function updateStats(){
  const ids = QUIZ_DATA.filter(matches).map(q=>q.id);
  let ans=0, cor=0;
  ids.forEach(id=>{ const s=state[id]; if(s&&s.answered){ans++; if(s.correct)cor++;} });
  const rate = ans? Math.round(cor/ans*100)+"%" : "—";
  document.getElementById("stats").innerHTML =
    `已答 <b>${ans}</b> / 正确 <b>${cor}</b> / 正确率 <b>${rate}</b>`;
}

document.getElementById("chapter").addEventListener("change", render);
document.getElementById("type").addEventListener("change", render);
document.getElementById("reset").addEventListener("click", ()=>{
  Object.keys(state).forEach(k=>delete state[k]);
  render();
});

buildFilters();
render();
</script>
</body>
</html>
